[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wxassist"
version = "0.1.1"
description = "微信副驾（WeChat Sidecar）：旁挂式微信 AI 回复助手，截屏 + 本地 OCR + 候选回复建议，永不自动发送"
requires-python = ">=3.10"
dependencies = [
    "rapidocr-onnxruntime>=1.3.24",
    "PySide6>=6.6",
    "windows-capture>=1.4",
    "keyboard>=0.13.5",
    "mss>=9.0.1",
    "Pillow>=10.0",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "httpx>=0.27",
    "pywin32>=306",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.urls]
Homepage = "https://github.com/r0ad/wechat-sidecar"
Repository = "https://github.com/r0ad/wechat-sidecar"
Issues = "https://github.com/r0ad/wechat-sidecar/issues"

[project.scripts]
wxassist = "wxassist.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wxassist = ["assets/*.ico", "assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
